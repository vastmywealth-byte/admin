<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VastMyWealth — Admin</title>
<style>
  :root{
    --navy:#0E1B3D; --navy-mid:#122654; --navy-light:#1B3466;
    --gold:#D4A741; --gold-light:#EACD86;
    --card:#FFFFFF; --text:#1B2333; --muted:#8B93A7; --line:#EDEFF3;
    --process:#B45309; --process-bg:#FEF3C7;
    --approved:#15803D; --approved-bg:#DCFCE7;
    --disbursed:#1D4ED8; --disbursed-bg:#DBEAFE;
    --rejected:#B91C1C; --rejected-bg:#FEE2E2;
    --pending:#B91C1C; --pending-bg:#FEE2E2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--navy); color:var(--text); -webkit-font-smoothing:antialiased; }
  img{max-width:100%; display:block;}

  #loginScreen{min-height:100vh; display:flex; flex-direction:column; background:var(--navy);}
  .splash-top{ background:#fff; border-radius:0 0 40px 40px; padding:44px 24px 34px; text-align:center; box-shadow:0 4px 0 var(--gold); }
  .splash-logo{width:80px; height:80px; margin:0 auto 16px; border-radius:50%; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.15); background:var(--navy); display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:sans-serif; font-weight:800; font-size:28px;}
  .splash-top h1{font-size:26px; margin:0; color:var(--navy); font-weight:800;}
  .splash-top .tagline{font-family:"Brush Script MT",cursive; color:#2B5FCB; font-size:20px; margin-top:2px;}
  .splash-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 26px 50px;}
  .splash-body h2{color:#fff; text-align:center; font-size:24px; line-height:1.3; margin:0 0 6px; font-weight:800;}
  .splash-body h2 .accent{color:var(--gold);}
  .splash-body .sub{color:#AFC0E8; text-align:center; font-size:13.5px; margin:14px 0 30px;}
  .login-card{width:100%; max-width:360px;}
  input[type=password]{ width:100%; padding:14px 16px; border:1px solid var(--navy-light); border-radius:10px; font-size:15px; margin-bottom:14px; background:var(--navy-mid); color:#fff; }
  input::placeholder{color:#8697C4;}
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  button{cursor:pointer; border:none; font-family:inherit;}
  .btn-primary{ width:100%; background:var(--gold); color:var(--navy); padding:14px; border-radius:10px; font-size:15px; font-weight:700; }
  .btn-primary:active{background:var(--gold-light);}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .login-error{color:#FF8A8A; font-size:13px; margin-top:10px; text-align:center; display:none;}

  #app{display:none; min-height:100vh; background:var(--navy);}
  header.topbar{ background:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; border-radius:0 0 20px 20px; box-shadow:0 4px 0 var(--gold); }
  header.topbar .title{display:flex; align-items:center; gap:10px;}
  header.topbar h2{font-size:15px; margin:0; font-weight:800; color:var(--navy);}
  header.topbar .refresh-btn{ background:var(--navy); color:var(--gold-light); padding:9px 14px; border-radius:8px; font-size:12.5px; font-weight:700; }

  .tab-switch{display:flex; gap:8px; padding:12px 16px 0;}
  .tab-btn{ flex:1; padding:10px; border-radius:9px; font-size:13px; font-weight:700; text-align:center; background:var(--navy-mid); color:#AFC0E8; border:1px solid var(--navy-light); }
  .tab-btn.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}

  .filters{display:flex; gap:8px; padding:12px 16px; overflow-x:auto; background:var(--navy);}
  .filters input{ margin:0; min-width:160px; flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--navy-light); background:var(--navy-mid); color:#fff; font-size:14px; }
  .filters input::placeholder{color:#8697C4;}
  .filters select{ padding:10px 10px; border-radius:8px; font-size:13px; background:var(--navy-mid); color:#fff; border:1px solid var(--navy-light); flex-shrink:0; }

  main{padding:14px 12px 80px;}

  .lead-card{ background:var(--card); border-radius:var(--radius); margin-bottom:10px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.18); border-left:4px solid var(--line); cursor:pointer; }
  .lead-card.status-process{border-left-color:var(--process);}
  .lead-card.status-approved{border-left-color:var(--approved);}
  .lead-card.status-disbursed{border-left-color:var(--disbursed);}
  .lead-card.status-rejected{border-left-color:var(--rejected);}
  .lead-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .lead-name{font-size:15px; font-weight:700; color:var(--navy);}
  .lead-company{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .lead-meta{font-size:12px; color:var(--muted); margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;}
  .lead-amount{font-weight:700; color:var(--text); font-size:13px; white-space:nowrap;}
  .partner-tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--gold-light); color:var(--navy); }
  .partner-tag.direct{background:var(--line); color:var(--muted);}
  .allocated-tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--navy); color:var(--gold-light); }
  .doc-pending-tag{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--pending-bg); color:var(--pending); }

  .contact-icons{display:flex; gap:6px; flex-shrink:0;}
  .contact-icons a{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; text-decoration:none; flex-shrink:0; }
  .contact-icons a.call-icon{background:var(--navy); color:var(--gold-light);}
  .contact-icons a.whatsapp-icon{background:#25D366; color:#fff;}
  .partner-actions a.whatsapp-icon{background:#25D366; color:#fff;}
.partner-actions a.folder-icon{background:var(--gold); color:var(--navy);}
  .contact-icons a.folder-icon{background:var(--gold); color:var(--navy);}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap;}
  .chip.process{background:var(--process-bg); color:var(--process);}
  .chip.approved{background:var(--approved-bg); color:var(--approved);}
  .chip.disbursed{background:var(--disbursed-bg); color:var(--disbursed);}
  .chip.rejected{background:var(--rejected-bg); color:var(--rejected);}

  .sent-to-line{font-size:11.5px; color:var(--muted); margin-top:6px;}
  .sent-to-line b{color:var(--text);}

  .empty-state{text-align:center; padding:60px 20px; color:#AFC0E8;}
  .error-state{text-align:center; padding:40px 20px; color:#FFC5C1; font-size:13.5px; line-height:1.6;}
  .error-state button{margin-top:14px; padding:10px 18px; background:var(--gold); color:var(--navy); border-radius:8px; font-weight:700; font-size:13px;}

  .partner-card{ background:var(--card); border-radius:var(--radius); margin-bottom:10px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.18); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .partner-info .pname{font-size:15px; font-weight:700; color:var(--navy);}
  .partner-info .pdetail{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .partner-actions{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{ width:38px; height:38px; border-radius:50%; background:var(--navy); color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; }

  .sheet-backdrop{display:none; position:fixed; inset:0; background:rgba(6,12,28,.6); z-index:20;}
  .sheet{ position:fixed; left:0; right:0; bottom:0; background:var(--navy); border-radius:20px 20px 0 0; max-height:92vh; overflow-y:auto; z-index:21; padding:18px 16px 30px; box-shadow:0 -6px 0 var(--gold); }
  .sheet-handle{width:36px; height:4px; background:var(--navy-light); border-radius:3px; margin:0 auto 14px;}
  .sheet h3{margin:0 0 2px; color:#fff; font-size:17px;}
  .sheet .sub{color:#AFC0E8; font-size:13px; margin-bottom:16px;}
  .close-x{position:absolute; top:14px; right:14px; background:none; font-size:20px; color:#AFC0E8; padding:4px;}

  .section-label{ font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--gold-light); margin:20px 0 8px; }

  .pipeline-row{ background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .pipeline-row-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .pipeline-row .lname{font-size:13.5px; font-weight:600; flex:1; color:var(--text);}
  .pipeline-row select{ font-size:12.5px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#fff; }
  .pipeline-row .dsa-note{font-size:11px; color:var(--muted); margin-top:5px;}

  .lender-select-list{ background:var(--card); border-radius:10px; padding:6px 12px; max-height:220px; overflow-y:auto; }
  .lender-select-list label{ display:flex; align-items:center; gap:10px; padding:9px 0; font-size:13.5px; border-bottom:1px solid var(--line); color:var(--text); }
  .lender-select-list label:last-child{border-bottom:none;}
  .lender-select-list input{width:auto; margin:0;}

  .dsa-select-list{background:var(--card); border-radius:10px; padding:4px 12px;}
  .dsa-select-list label{ display:flex; align-items:center; gap:10px; padding:10px 0; font-size:13.5px; border-bottom:1px solid var(--line); color:var(--text); }
  .dsa-select-list label:last-child{border-bottom:none;}
  .dsa-select-list input{width:auto; margin:0;}
  .dsa-email{color:var(--muted); font-size:11.5px; display:block;}

  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn-secondary{ flex:1; background:var(--navy-mid); border:1px solid var(--gold); color:var(--gold-light); padding:12px; border-radius:8px; font-weight:600; font-size:13.5px; }
  .btn-gold{flex:1; background:var(--gold); color:var(--navy); padding:12px; border-radius:8px; font-weight:700; font-size:13.5px;}
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--navy); padding:10px 18px; border-radius:24px; font-size:13px; font-weight:700; z-index:30; display:none; max-width:90%; text-align:center; }
  .toast.error{background:var(--rejected); color:#fff;}
  .spinner-inline{font-size:12px; color:var(--muted);}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="splash-top">
    <div class="splash-logo">VMW</div>
    <h1>VastMyWealth</h1>
    <div class="tagline">Digital</div>
  </div>
  <div class="splash-body">
    <h2>Admin <span class="accent">Control Panel</span></h2>
    <div class="sub">Manage leads, lenders &amp; DSA assignments</div>
    <div class="login-card">
      <input type="password" id="adminPassword" placeholder="Admin password">
      <button class="btn-primary" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="topbar">
    <div class="title">
      <h2>Admin Panel</h2>
    </div>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </header>

  <div class="tab-switch">
    <button class="tab-btn active" id="tabBtnLeads">Leads</button>
    <button class="tab-btn" id="tabBtnPartners">Partners</button>
  </div>

  <!-- LEADS TAB -->
  <div id="leadsTab">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Search name, company, mobile...">
      <select id="productFilter">
        <option value="">All Products</option>
        <option value="PL">PL</option>
        <option value="BL">BL</option>
        <option value="LAP">LAP</option>
        <option value="HL">HL</option>
      </select>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="In Process">In Process</option>
        <option value="Approved">Approved</option>
        <option value="Disbursed">Disbursed</option>
        <option value="Rejected">Rejected</option>
      </select>
            <select id="docFilter">
        <option value="">All Documents</option>
        <option value="Pending">Documents Pending</option>
        <option value="Submitted">Documents Submitted</option>
      </select>
      <label style="color:#AFC0E8; font-size:12px; display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <input type="checkbox" id="showHiddenCheckbox"> Show hidden
      </label>
    </div>
    <main><div id="leadsContainer"><div class="empty-state">Loading leads…</div></div></main>
  </div>

  <!-- PARTNERS TAB -->
  <div id="partnersTab" style="display:none;">
    <div class="filters">
      <input type="text" id="partnerSearchBox" placeholder="Search partner name or mobile...">
    </div>
    <main><div id="partnersContainer"><div class="empty-state">Loading partners…</div></div></main>
  </div>
</div>

<!-- ===================== LEAD DETAIL SHEET ===================== -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" style="display:none;">
  <div class="sheet-handle"></div>
  <button class="close-x" id="closeSheetBtn">✕</button>
  <h3 id="sheetName"></h3>
  <div class="sub" id="sheetSub"></div>

  <div class="section-label">Lender Pipeline</div>
  <div id="pipelineRows"></div>

  <div class="section-label">Send To Additional Lenders</div>
  <div class="lender-select-list" id="lenderSelectList"><div class="spinner-inline">Loading lenders…</div></div>
  <button class="btn-secondary" style="width:100%; margin-top:10px;" id="addLendersBtn">Add Selected Lenders</button>

    <div class="section-label">Assign To DSA</div>
  <div class="dsa-select-list" id="dsaSelectList"><div class="spinner-inline">Loading DSAs…</div></div>
  <div class="btn-row">
    <button class="btn-gold" id="assignDsaBtn">Assign &amp; Send Email</button>
  </div>

  <div class="section-label" style="color:#FF8A8A;">Danger Zone</div>
  <div class="btn-row">
    <button class="btn-secondary" id="hideLeadBtn">Hide from list</button>
    <button class="btn-secondary" id="deleteLeadBtn" style="border-color:#B91C1C; color:#FFC5C1;">Delete permanently</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ⚠️ SET THIS to your Apps Script Web App URL (Deploy → Manage deployments)
var API_URL = "https://script.google.com/macros/s/AKfycbwGTSTzKTJYrhx2wP3UuBPG_64g-ZczNPhem3-PfcPPu8AYQaT0MvSgz1FsyRdoonVndg/exec";

var ADMIN_PASSWORD = "";
var ALL_LEADS = [];
var ACTIVE_LENDERS = [];
var ACTIVE_DSAS = [];
var ALL_PARTNERS = [];
var CURRENT_LEAD = null;

function showToast(msg, isError) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isError ? " error" : "");
  t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 3200);
}

// Every backend call goes through here. Any network failure or
// non-JSON response (e.g. an Apps Script error page) is caught
// and surfaced instead of hanging silently.
function apiPost(payload) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
    .then(function(res){ return res.text(); })
    .then(function(raw){
      try { return JSON.parse(raw); }
      catch(e){ throw new Error("Server returned a non-JSON response (likely a script error or stale deployment). Raw: " + raw.slice(0,200)); }
    });
}

/* ---------------- LOGIN ---------------- */

function doLogin() {
  var pw = document.getElementById("adminPassword").value;
  var errEl = document.getElementById("loginError");
  errEl.style.display = "none";
  if (!pw) return;

  var btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Signing in…";

  // Step 1: fast password check only — no sheet scanning.
  apiPost({ action: "adminLogin", password: pw })
    .then(function(loginResult){
      if (!loginResult.success) {
        btn.disabled = false; btn.textContent = "Sign In";
        errEl.textContent = "Incorrect password. Please try again.";
        errEl.style.display = "block";
        return;
      }
      ADMIN_PASSWORD = pw;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("leadsContainer").innerHTML = '<div class="empty-state">Loading leads…</div>';
      document.getElementById("partnersContainer").innerHTML = '<div class="empty-state">Loading partners…</div>';

      // Step 2: heavier dashboard data fetched only after login succeeds.
      apiPost({ action: "adminGetDashboardData", password: ADMIN_PASSWORD })
        .then(function(result){
          btn.disabled = false; btn.textContent = "Sign In";
          if (result.success) {
            applyDashboardData(result);
          } else {
            document.getElementById("leadsContainer").innerHTML =
              '<div class="error-state">Failed to load leads: ' + escapeHtml(result.error || "Unknown error") +
              '<br><button onclick="refreshAll()">Retry</button></div>';
          }
        })
        .catch(function(err){
          btn.disabled = false; btn.textContent = "Sign In";
          document.getElementById("leadsContainer").innerHTML =
            '<div class="error-state">' + escapeHtml(err.message) +
            '<br><button onclick="refreshAll()">Retry</button></div>';
        });
    })
    .catch(function(err){
      btn.disabled = false; btn.textContent = "Sign In";
      errEl.textContent = "Connection error: " + err.message;
      errEl.style.display = "block";
    });
}
function applyDashboardData(result) {
  ALL_LEADS = result.leads || [];
  ACTIVE_LENDERS = result.lenders || [];
  ACTIVE_DSAS = result.dsas || [];
  ALL_PARTNERS = result.partners || [];
  renderLeads();
  renderPartners();
}

function refreshAll() {
  document.getElementById("leadsContainer").innerHTML = '<div class="empty-state">Loading leads…</div>';
  document.getElementById("partnersContainer").innerHTML = '<div class="empty-state">Loading partners…</div>';

  apiPost({ action: "adminClearCache", password: ADMIN_PASSWORD })
    .catch(function(){ /* non-fatal — proceed to reload anyway */ })
    .then(function(){
      return apiPost({ action: "adminGetDashboardData", password: ADMIN_PASSWORD });
    })
    .then(function(result){
      if (result.success) {
        applyDashboardData(result);
        showToast("Refreshed");
      } else {
        document.getElementById("leadsContainer").innerHTML =
          '<div class="error-state">Failed to load leads: ' + escapeHtml(result.error || "Unknown error") + '</div>';
        showToast(result.error || "Failed to refresh", true);
      }
    })
    .catch(function(err){
      document.getElementById("leadsContainer").innerHTML =
        '<div class="error-state">' + escapeHtml(err.message) +
        '<br><button onclick="refreshAll()">Retry</button></div>';
      showToast("Connection error", true);
    });
}

/* ---------------- TABS ---------------- */

function switchTab(tab) {
  document.getElementById("leadsTab").style.display = tab === "leads" ? "block" : "none";
  document.getElementById("partnersTab").style.display = tab === "partners" ? "block" : "none";
  document.getElementById("tabBtnLeads").classList.toggle("active", tab === "leads");
  document.getElementById("tabBtnPartners").classList.toggle("active", tab === "partners");
}

/* ---------------- LEADS ---------------- */

function overallStatusClass(pipeline) {
  if (!pipeline || pipeline.length === 0) return "";
  var order = ["Disbursed","Approved","In Process","Rejected"];
  var map = { "In Process":"status-process","Approved":"status-approved","Disbursed":"status-disbursed","Rejected":"status-rejected" };
  for (var i = 0; i < order.length; i++) {
    for (var j = 0; j < pipeline.length; j++) {
      if (pipeline[j].status === order[i]) return map[order[i]];
    }
  }
  return "";
}

function chipClass(status) {
  return { "In Process":"process","Approved":"approved","Disbursed":"disbursed","Rejected":"rejected" }[status] || "process";
}
function currentIncludeHidden() {
  var cb = document.getElementById("showHiddenCheckbox");
  return !!(cb && cb.checked);
}

function reloadLeadsOnly() {
  document.getElementById("leadsContainer").innerHTML = '<div class="empty-state">Loading leads…</div>';
  apiPost({ action: "adminGetAllLeads", password: ADMIN_PASSWORD, includeHidden: currentIncludeHidden() })
    .then(function(result){
      if (result.success) {
        ALL_LEADS = result.leads || [];
        renderLeads();
      } else {
        document.getElementById("leadsContainer").innerHTML =
          '<div class="error-state">' + escapeHtml(result.error || "Failed to load leads") + '</div>';
      }
    })
    .catch(function(err){
      document.getElementById("leadsContainer").innerHTML =
        '<div class="error-state">' + escapeHtml(err.message) + '</div>';
    });
}
function escapeHtml(s){ var d = document.createElement('div'); d.textContent = (s === undefined || s === null) ? '' : s; return d.innerHTML; }

function renderLeads() {
  var qEl = document.getElementById("searchBox");
  var productEl = document.getElementById("productFilter");
  var statusEl = document.getElementById("statusFilter");
  var docEl = document.getElementById("docFilter");
  var container = document.getElementById("leadsContainer");

  var q = (qEl && qEl.value || "").toLowerCase();
  var productF = productEl ? productEl.value : "";
  var statusF = statusEl ? statusEl.value : "";
  var docF = docEl ? docEl.value : "";

  var leads = ALL_LEADS.filter(function(l){
    if (q) {
      var hay = ((l.name||"") + " " + (l.companyName||"") + " " + (l.mobile||"")).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (productF && l.product !== productF) return false;
    if (statusF && !(l.pipeline||[]).some(function(p){ return p.status === statusF; })) return false;
    if (docF && l.documentStatus !== docF) return false;
    return true;
  });

  if (leads.length === 0) {
    container.innerHTML = '<div class="empty-state">No leads match your filters.</div>';
    return;
  }

  container.innerHTML = leads.map(function(l){
    var idx = ALL_LEADS.indexOf(l);
    var chips = (l.pipeline||[]).map(function(p){ return '<span class="chip ' + chipClass(p.status) + '">' + escapeHtml(p.lender) + ': ' + escapeHtml(p.status) + '</span>'; }).join("");
    var sentTo = (l.sentToDsas && l.sentToDsas.length) ? ('<div class="sent-to-line">Sent to: <b>' + escapeHtml(l.sentToDsas.join(", ")) + '</b></div>') : "";
    var cleanMobile = String(l.mobile || "").replace(/\D/g,"");
    var folderIcon = l.documentsFolderUrl ? ('<a class="folder-icon" href="' + l.documentsFolderUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="View Documents">\uD83D\uDCC1</a>') : "";
    var contactIcons = (cleanMobile || l.documentsFolderUrl) ? (
        '<div class="contact-icons" onclick="event.stopPropagation()">' +
          (cleanMobile ? '<a class="call-icon" href="tel:' + cleanMobile + '" title="Call">\u260E</a>' : '') +
          (cleanMobile ? '<a class="whatsapp-icon" href="https://wa.me/91' + cleanMobile + '" target="_blank" rel="noopener" title="WhatsApp">\u2713</a>' : '') +
          folderIcon +
        '</div>') : "";

       var docTag = l.documentStatus === 'Pending' ? '<span class="doc-pending-tag">Documents Pending</span>' : '';
    var hiddenTag = l.hidden ? '<span class="doc-pending-tag" style="background:#374151; color:#D1D5DB;">Hidden</span>' : '';
    return '' +
      '<div class="lead-card ' + overallStatusClass(l.pipeline) + '" onclick="openSheet(' + idx + ')">' +
        '<div class="lead-top">' +
          '<div>' +
            '<div class="lead-name">' + escapeHtml(l.name || "—") + '</div>' +
            (l.companyName ? ('<div class="lead-company">' + escapeHtml(l.companyName) + '</div>') : "") +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:8px;">' +
            '<div class="lead-amount">\u20B9' + escapeHtml(l.loanAmount || "—") + '</div>' +
            contactIcons +
          '</div>' +
        '</div>' +
        '<div class="lead-meta">' +
          '<span>' + escapeHtml(l.product || "—") + ' \u00B7 ' + escapeHtml(l.category || "—") + '</span>' +
          '<span>' + escapeHtml(l.mobile || "") + '</span>' +
          '<span class="partner-tag ' + (l.partnerName === 'Direct' ? 'direct' : '') + '">' + escapeHtml(l.partnerName) + '</span>' +
                    (l.isAllocated ? '<span class="allocated-tag">Allocated</span>' : '') +
          docTag +
          hiddenTag +
        '</div>' +
        (chips ? ('<div class="chip-row">' + chips + '</div>') : '<div class="chip-row"><span class="chip process">No lenders in pipeline yet</span></div>') +
        sentTo +
      '</div>';
  }).join("");
}

function openSheet(idx) {
  CURRENT_LEAD = ALL_LEADS[idx];
  if (!CURRENT_LEAD) return;
  document.getElementById("sheetName").textContent = CURRENT_LEAD.name || "—";
  document.getElementById("sheetSub").textContent =
    (CURRENT_LEAD.companyName ? CURRENT_LEAD.companyName + " \u00B7 " : "") + CURRENT_LEAD.product + " \u00B7 \u20B9" + (CURRENT_LEAD.loanAmount || "—") + " \u00B7 " + CURRENT_LEAD.mobile;

  renderPipelineRows();
  renderLenderSelectList();
  renderDsaSelectList();

  var hideBtn = document.getElementById("hideLeadBtn");
  hideBtn.textContent = CURRENT_LEAD.hidden ? "Unhide (show in list again)" : "Hide from list";

  document.getElementById("sheetBackdrop").style.display = "block";
  document.getElementById("sheet").style.display = "block";
}

function toggleHideCurrentLead() {
  if (!CURRENT_LEAD) return;
  var hide = !CURRENT_LEAD.hidden;
  apiPost({
    action: hide ? "adminHideLead" : "adminUnhideLead",
    password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, product: CURRENT_LEAD.product
  }).then(function(result){
    if (result.success) {
      showToast(hide ? "Lead hidden" : "Lead unhidden");
      closeSheet();
      reloadLeadsOnly();
    } else {
      showToast(result.error || "Action failed", true);
    }
  }).catch(function(err){ showToast("Connection error: " + err.message, true); });
}

function deleteCurrentLead() {
  if (!CURRENT_LEAD) return;
  var confirmed = confirm("Permanently delete this lead (" + (CURRENT_LEAD.name || "—") + ")? This cannot be undone.");
  if (!confirmed) return;
  apiPost({
    action: "adminDeleteLead", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, product: CURRENT_LEAD.product
  }).then(function(result){
    if (result.success) {
      showToast("Lead deleted");
      closeSheet();
      reloadLeadsOnly();
    } else {
      showToast(result.error || "Delete failed", true);
    }
  }).catch(function(err){ showToast("Connection error: " + err.message, true); });
}
function closeSheet() {
  document.getElementById("sheetBackdrop").style.display = "none";
  document.getElementById("sheet").style.display = "none";
  CURRENT_LEAD = null;
}

function renderPipelineRows() {
  var el = document.getElementById("pipelineRows");
  var pipeline = CURRENT_LEAD.pipeline || [];
  if (pipeline.length === 0) {
    el.innerHTML = '<div class="spinner-inline">No lenders in pipeline yet — add some below.</div>';
    return;
  }
  el.innerHTML = pipeline.map(function(p){
    var safeName = p.lender.replace(/'/g, "\\'");
    var options = ["In Process","Approved","Disbursed","Rejected"].map(function(s){
      return '<option value="' + s + '" ' + (s === p.status ? "selected" : "") + '>' + s + '</option>';
    }).join("");
    return '' +
      '<div class="pipeline-row">' +
        '<div class="pipeline-row-top">' +
          '<div class="lname">' + escapeHtml(p.lender) + '</div>' +
          '<select onchange="updateStatus(\'' + safeName + '\', this.value)">' + options + '</select>' +
        '</div>' +
        (p.assignedDsa ? ('<div class="dsa-note">Sent to: ' + escapeHtml(p.assignedDsa) + '</div>') : "") +
      '</div>';
  }).join("");
}

function renderLenderSelectList() {
  var el = document.getElementById("lenderSelectList");
  var already = {};
  (CURRENT_LEAD.pipeline||[]).forEach(function(p){ already[p.lender] = true; });
  var relevant = ACTIVE_LENDERS.filter(function(l){ return l.product === CURRENT_LEAD.product && !already[l.name]; });
  if (relevant.length === 0) {
    el.innerHTML = '<div class="spinner-inline" style="padding:10px 0;">No more lenders available for this product.</div>';
    return;
  }
  el.innerHTML = relevant.map(function(l){
    return '<label><input type="checkbox" value="' + escapeHtml(l.name) + '" class="lenderCheckbox"> ' + escapeHtml(l.name) + ' <span class="spinner-inline">(Cat ' + escapeHtml(l.category) + ')</span></label>';
  }).join("");
}

function renderDsaSelectList() {
  var el = document.getElementById("dsaSelectList");
  if (ACTIVE_DSAS.length === 0) {
    el.innerHTML = '<div class="spinner-inline" style="padding:10px 0;">No DSAs added yet — add rows in the DSA Partners sheet tab.</div>';
    return;
  }
  el.innerHTML = ACTIVE_DSAS.map(function(d, i){
    return '<label><input type="radio" name="dsaPick" value="' + i + '"><span>' + escapeHtml(d.name) + '<span class="dsa-email">' + escapeHtml(d.emails) + '</span></span></label>';
  }).join("");
}

function updateStatus(lenderName, status) {
  apiPost({
    action: "adminUpdateLenderStatus", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, lenderName: lenderName, status: status
  }).then(function(result){
    if (result.success) {
      showToast("Status updated");
      var row = CURRENT_LEAD.pipeline.find(function(p){ return p.lender === lenderName; });
      if (row) row.status = status;
      renderLeads();
    } else {
      showToast(result.error || "Update failed", true);
    }
  }).catch(function(err){ showToast("Connection error: " + err.message, true); });
}

function addSelectedLenders() {
  var checked = Array.prototype.slice.call(document.querySelectorAll(".lenderCheckbox:checked")).map(function(c){ return c.value; });
  if (checked.length === 0) { showToast("Select at least one lender"); return; }
  apiPost({
    action: "adminAddLendersToPipeline", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, mobile: CURRENT_LEAD.mobile, customerName: CURRENT_LEAD.name,
    companyName: CURRENT_LEAD.companyName, product: CURRENT_LEAD.product, lenderNames: checked
  }).then(function(result){
    if (result.success) {
      showToast("Lenders added");
      checked.forEach(function(name){ CURRENT_LEAD.pipeline.push({ lender:name, status:"In Process", assignedDsa:"" }); });
      renderPipelineRows();
      renderLenderSelectList();
      renderLeads();
    } else {
      showToast(result.error || "Failed to add lenders", true);
    }
  }).catch(function(err){ showToast("Connection error: " + err.message, true); });
}

function assignDsa() {
  var picked = document.querySelector('input[name="dsaPick"]:checked');
  if (!picked) { showToast("Select a DSA"); return; }
  var dsa = ACTIVE_DSAS[picked.value];
  var lenderNames = (CURRENT_LEAD.pipeline || []).map(function(p){ return p.lender; });
  if (lenderNames.length === 0) { showToast("Add lenders to the pipeline first"); return; }

  apiPost({
    action: "adminAssignDsa", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, mobile: CURRENT_LEAD.mobile, customerName: CURRENT_LEAD.name,
    companyName: CURRENT_LEAD.companyName, product: CURRENT_LEAD.product, loanAmount: CURRENT_LEAD.loanAmount,
    dsaName: dsa.name, dsaEmails: dsa.emails, lenderNames: lenderNames, assignedBy: "Admin"
  }).then(function(result){
    if (result.success) {
      showToast("Assigned — email sent to " + dsa.name);
      CURRENT_LEAD.pipeline.forEach(function(p){
        var names = p.assignedDsa ? p.assignedDsa.split(",").map(function(s){return s.trim();}) : [];
        if (names.indexOf(dsa.name) === -1) names.push(dsa.name);
        p.assignedDsa = names.join(", ");
      });
      if (!CURRENT_LEAD.sentToDsas) CURRENT_LEAD.sentToDsas = [];
      if (CURRENT_LEAD.sentToDsas.indexOf(dsa.name) === -1) CURRENT_LEAD.sentToDsas.push(dsa.name);
      CURRENT_LEAD.isAllocated = true;
      renderPipelineRows();
      renderLeads();
    } else {
      showToast(result.error || "Assignment failed", true);
    }
  }).catch(function(err){ showToast("Connection error: " + err.message, true); });
}

/* ---------------- PARTNERS ---------------- */

function renderPartners() {
  var qEl = document.getElementById("partnerSearchBox");
  var q = ((qEl && qEl.value) || "").toLowerCase();
  var container = document.getElementById("partnersContainer");
  var partners = ALL_PARTNERS.filter(function(p){
    return !q || String(p.name||"").toLowerCase().indexOf(q) !== -1 || String(p.mobile||"").indexOf(q) !== -1;

  });
  if (partners.length === 0) {
    container.innerHTML = '<div class="empty-state">No partners found.</div>';
    return;
  }
    container.innerHTML = partners.map(function(p, i){
    var cleanMobile = String(p.mobile || "").replace(/\D/g,"");
    var count = p.last30Count || 0;
    var rankTag = (i === 0 && count > 0) ? ' <span style="color:var(--gold); font-weight:800;">🏆 Top Partner</span>' : '';
    return '' +
      '<div class="partner-card">' +
        '<div class="partner-info">' +
          '<div class="pname">' + escapeHtml(p.name || "—") + rankTag + '</div>' +
          '<div class="pdetail">' + escapeHtml(p.mobile || "") + (p.email ? (' \u00B7 ' + escapeHtml(p.email)) : "") + '</div>' +
          '<div class="pdetail" style="margin-top:3px; color:var(--navy); font-weight:700;">' + count + ' application' + (count === 1 ? '' : 's') + ' \u00B7 last 30 days</div>' +
        '</div>' +
        '<div class="partner-actions">' +
          (p.mobile ? ('<a class="icon-btn" href="tel:' + p.mobile + '">\u260E</a>') : "") +
          (p.email ? ('<a class="icon-btn" href="mailto:' + p.email + '">\u2709</a>') : "") +
          (cleanMobile ? ('<a class="icon-btn whatsapp-icon" href="https://wa.me/91' + cleanMobile + '" target="_blank" rel="noopener" title="WhatsApp">\u2713</a>') : "") +
          (p.chequeLink ? ('<a class="icon-btn folder-icon" href="' + p.chequeLink + '" target="_blank" rel="noopener" title="View Cancelled Cheque">\uD83D\uDCC1</a>') : "") +
        '</div>' +
      '</div>';
  }).join("");
}

/* ---------------- WIRE UP EVENT LISTENERS ---------------- */

document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("adminPassword").addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); });
document.getElementById("refreshBtn").addEventListener("click", refreshAll);
document.getElementById("tabBtnLeads").addEventListener("click", function(){ switchTab("leads"); });
document.getElementById("tabBtnPartners").addEventListener("click", function(){ switchTab("partners"); });
document.getElementById("searchBox").addEventListener("input", renderLeads);
document.getElementById("productFilter").addEventListener("change", renderLeads);
document.getElementById("statusFilter").addEventListener("change", renderLeads);
document.getElementById("docFilter").addEventListener("change", renderLeads);
document.getElementById("partnerSearchBox").addEventListener("input", renderPartners);
document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
document.getElementById("addLendersBtn").addEventListener("click", addSelectedLenders);
document.getElementById("assignDsaBtn").addEventListener("click", assignDsa);
document.getElementById("hideLeadBtn").addEventListener("click", toggleHideCurrentLead);
document.getElementById("deleteLeadBtn").addEventListener("click", deleteCurrentLead);
document.getElementById("showHiddenCheckbox").addEventListener("change", reloadLeadsOnly);
</script>
</body>
</html>
