<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VastMyWealth — Admin</title>
<style>
  :root{
    --navy:#0E1B3D;
    --navy-mid:#122654;
    --navy-light:#1B3466;
    --gold:#D4A741;
    --gold-light:#EACD86;
    --card:#FFFFFF;
    --text:#1B2333;
    --muted:#8B93A7;
    --line:#EDEFF3;
    --process:#B45309;
    --process-bg:#FEF3C7;
    --approved:#15803D;
    --approved-bg:#DCFCE7;
    --disbursed:#1D4ED8;
    --disbursed-bg:#DBEAFE;
    --rejected:#B91C1C;
    --rejected-bg:#FEE2E2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--navy); color:var(--text); -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}

  /* ---------- LOGIN (full-screen splash, matches customer portal) ---------- */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column;
    background:var(--navy);
  }
  .splash-top{
    background:#fff; border-radius:0 0 40px 40px; padding:44px 24px 34px;
    text-align:center; box-shadow:0 4px 0 var(--gold);
  }
  .splash-logo{width:110px; height:110px; margin:0 auto 16px; border-radius:50%; overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.15);}
  .splash-logo img{width:100%; height:100%; object-fit:cover;}
  .splash-top h1{font-size:26px; margin:0; color:var(--navy); font-weight:800; letter-spacing:.2px;}
  .splash-top .tagline{font-family:"Brush Script MT",cursive; color:#2B5FCB; font-size:20px; margin-top:2px;}

  .splash-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 26px 50px;}
  .splash-body h2{
    color:#fff; text-align:center; font-size:24px; line-height:1.3; margin:0 0 6px; font-weight:800;
  }
  .splash-body h2 .accent{color:var(--gold);}
  .splash-body .sub{color:#AFC0E8; text-align:center; font-size:13.5px; margin:14px 0 30px;}

  .login-card{width:100%; max-width:360px;}
  input[type=password]{
    width:100%; padding:14px 16px; border:1px solid var(--navy-light); border-radius:10px;
    font-size:15px; margin-bottom:14px; background:var(--navy-mid); color:#fff;
  }
  input::placeholder{color:#8697C4;}
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  button{cursor:pointer; border:none; font-family:inherit;}
  .btn-primary{
    width:100%; background:var(--gold); color:var(--navy); padding:14px; border-radius:10px;
    font-size:15px; font-weight:700; letter-spacing:.2px;
  }
  .btn-primary:active{background:var(--gold-light);}
  .login-error{color:#FF8A8A; font-size:13px; margin-top:10px; text-align:center; display:none;}

  /* ---------- APP SHELL (full navy background) ---------- */
  #app{display:none; min-height:100vh; background:var(--navy);}
  header.topbar{
    background:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    border-radius:0 0 20px 20px; box-shadow:0 4px 0 var(--gold);
  }
  header.topbar .title{display:flex; align-items:center; gap:10px;}
  header.topbar .logo-mark{width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0;}
  header.topbar .logo-mark img{width:100%; height:100%; object-fit:cover;}
  header.topbar h2{font-size:15px; margin:0; font-weight:800; color:var(--navy);}
  header.topbar .refresh-btn{
    background:var(--navy); color:var(--gold-light); padding:9px 14px; border-radius:8px; font-size:12.5px; font-weight:700;
  }

  .filters{
    display:flex; gap:8px; padding:12px 16px; overflow-x:auto; background:var(--navy-mid);
  }
  .filters input{
    margin:0; min-width:160px; flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--navy-light);
    background:var(--navy); color:#fff; font-size:14px;
  }
  .filters input::placeholder{color:#8697C4;}
  .filters select{
    padding:10px 10px; border-radius:8px; font-size:13px; background:var(--navy); color:#fff;
    border:1px solid var(--navy-light); flex-shrink:0;
  }

  main{padding:14px 12px 80px;}

  .lead-card{
    background:var(--card); border-radius:var(--radius); margin-bottom:10px;
    padding:14px; box-shadow:0 4px 14px rgba(0,0,0,.18); border-left:4px solid var(--line);
    cursor:pointer;
  }
  .lead-card.status-process{border-left-color:var(--process);}
  .lead-card.status-approved{border-left-color:var(--approved);}
  .lead-card.status-disbursed{border-left-color:var(--disbursed);}
  .lead-card.status-rejected{border-left-color:var(--rejected);}

  .lead-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .lead-name{font-size:15px; font-weight:700; color:var(--navy);}
  .lead-company{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .lead-meta{font-size:12px; color:var(--muted); margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 14px;}
  .lead-amount{font-weight:700; color:var(--text); font-size:13px; white-space:nowrap;}
  .partner-tag{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:2px 7px; border-radius:5px; background:var(--gold-light); color:var(--navy);
  }
  .partner-tag.direct{background:var(--line); color:var(--muted);}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap;}
  .chip.process{background:var(--process-bg); color:var(--process);}
  .chip.approved{background:var(--approved-bg); color:var(--approved);}
  .chip.disbursed{background:var(--disbursed-bg); color:var(--disbursed);}
  .chip.rejected{background:var(--rejected-bg); color:var(--rejected);}

  .empty-state{text-align:center; padding:60px 20px; color:#AFC0E8;}

  /* ---------- MODAL / DETAIL SHEET ---------- */
  .sheet-backdrop{display:none; position:fixed; inset:0; background:rgba(6,12,28,.6); z-index:20;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--navy);
    border-radius:20px 20px 0 0; max-height:92vh; overflow-y:auto; z-index:21;
    padding:18px 16px 30px; box-shadow:0 -6px 0 var(--gold);
  }
  .sheet-handle{width:36px; height:4px; background:var(--navy-light); border-radius:3px; margin:0 auto 14px;}
  .sheet h3{margin:0 0 2px; color:#fff; font-size:17px;}
  .sheet .sub{color:#AFC0E8; font-size:13px; margin-bottom:16px;}
  .close-x{position:absolute; top:14px; right:14px; background:none; font-size:20px; color:#AFC0E8; padding:4px;}

  .section-label{
    font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:var(--gold-light); margin:20px 0 8px;
  }

  .pipeline-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .pipeline-row .lname{font-size:13.5px; font-weight:600; flex:1; color:var(--text);}
  .pipeline-row select{
    font-size:12.5px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:#fff;
  }

  .lender-select-list{
    background:var(--card); border-radius:10px; padding:6px 12px; max-height:220px; overflow-y:auto;
  }
  .lender-select-list label{
    display:flex; align-items:center; gap:10px; padding:9px 0; font-size:13.5px; border-bottom:1px solid var(--line); color:var(--text);
  }
  .lender-select-list label:last-child{border-bottom:none;}
  .lender-select-list input{width:auto; margin:0;}

  .dsa-select-list{background:var(--card); border-radius:10px; padding:4px 12px;}
  .dsa-select-list label{
    display:flex; align-items:center; gap:10px; padding:10px 0; font-size:13.5px; border-bottom:1px solid var(--line); color:var(--text);
  }
  .dsa-select-list label:last-child{border-bottom:none;}
  .dsa-select-list input{width:auto; margin:0;}
  .dsa-email{color:var(--muted); font-size:11.5px; display:block;}

  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn-secondary{
    flex:1; background:var(--navy-mid); border:1px solid var(--gold); color:var(--gold-light); padding:12px; border-radius:8px;
    font-weight:600; font-size:13.5px;
  }
  .btn-gold{
    flex:1; background:var(--gold); color:var(--navy); padding:12px; border-radius:8px;
    font-weight:700; font-size:13.5px;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--navy); padding:10px 18px; border-radius:24px; font-size:13px; font-weight:700;
    z-index:30; display:none;
  }
  .spinner-inline{font-size:12px; color:var(--muted);}
</style>
</head>

      <h2>Admin Panel</h2>
    </div>
    <button class="refresh-btn" onclick="loadLeads()">Refresh</button>
  </header>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search name, company, mobile..." oninput="renderLeads()">
    <select id="productFilter" onchange="renderLeads()">
      <option value="">All Products</option>
      <option value="PL">PL</option>
      <option value="BL">BL</option>
      <option value="LAP">LAP</option>
      <option value="HL">HL</option>
    </select>
    <select id="statusFilter" onchange="renderLeads()">
      <option value="">All Statuses</option>
      <option value="In Process">In Process</option>
      <option value="Approved">Approved</option>
      <option value="Disbursed">Disbursed</option>
      <option value="Rejected">Rejected</option>
    </select>
  </div>

  <main>
    <div id="leadsContainer"><div class="empty-state">Loading leads…</div></div>
  </main>
</div>

<!-- ===================== LEAD DETAIL SHEET ===================== -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" style="display:none;">
  <div class="sheet-handle"></div>
  <button class="close-x" onclick="closeSheet()">✕</button>
  <h3 id="sheetName"></h3>
  <div class="sub" id="sheetSub"></div>

  <div class="section-label">Lender Pipeline</div>
  <div id="pipelineRows"></div>

  <div class="section-label">Send To Additional Lenders</div>
  <div class="lender-select-list" id="lenderSelectList"><div class="spinner-inline">Loading lenders…</div></div>
  <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="addSelectedLenders()">Add Selected Lenders</button>

  <div class="section-label">Assign To DSA</div>
  <div class="dsa-select-list" id="dsaSelectList"><div class="spinner-inline">Loading DSAs…</div></div>
  <div class="btn-row">
    <button class="btn-gold" onclick="assignDsa()">Assign & Send Email</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ⚠️ SET THIS to your Apps Script Web App URL (Deploy → Manage deployments)
const API_URL = "https://script.google.com/macros/s/AKfycbwGTSTzKTJYrhx2wP3UuBPG_64g-ZczNPhem3-PfcPPu8AYQaT0MvSgz1FsyRdoonVndg/exec
";

let ADMIN_PASSWORD = "";
let ALL_LEADS = [];
let ACTIVE_LENDERS = [];
let ACTIVE_DSAS = [];
let CURRENT_LEAD = null;

async function apiPost(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
}

async function doLogin() {
  const pw = document.getElementById("adminPassword").value;
  if (!pw) return;
  const result = await apiPost({ action: "adminLogin", password: pw });
  if (result.success) {
    ADMIN_PASSWORD = pw;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadLeads();
    loadActiveLenders();
    loadDsaList();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

async function loadLeads() {
  const container = document.getElementById("leadsContainer");
  container.innerHTML = '<div class="empty-state">Loading leads…</div>';
  const result = await apiPost({ action: "adminGetAllLeads", password: ADMIN_PASSWORD });
  if (!result.success) { showToast(result.error || "Failed to load leads"); return; }
  ALL_LEADS = result.leads || [];
  renderLeads();
}

async function loadActiveLenders() {
  const result = await apiPost({ action: "adminGetActiveLenders", password: ADMIN_PASSWORD });
  if (result.success) ACTIVE_LENDERS = result.lenders || [];
}

async function loadDsaList() {
  const result = await apiPost({ action: "adminGetDsaList", password: ADMIN_PASSWORD });
  if (result.success) ACTIVE_DSAS = result.dsas || [];
}

function overallStatusClass(pipeline) {
  if (!pipeline || pipeline.length === 0) return "";
  const order = ["Disbursed","Approved","In Process","Rejected"];
  for (const s of order) {
    if (pipeline.some(p => p.status === s)) {
      return { "In Process":"status-process","Approved":"status-approved","Disbursed":"status-disbursed","Rejected":"status-rejected" }[s];
    }
  }
  return "";
}

function chipClass(status) {
  return { "In Process":"process","Approved":"approved","Disbursed":"disbursed","Rejected":"rejected" }[status] || "process";
}

function renderLeads() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const productF = document.getElementById("productFilter").value;
  const statusF = document.getElementById("statusFilter").value;
  const container = document.getElementById("leadsContainer");

  let leads = ALL_LEADS.filter(l => {
    if (q && !((l.name||"").toLowerCase().includes(q) || (l.companyName||"").toLowerCase().includes(q) || (l.mobile||"").includes(q))) return false;
    if (productF && l.product !== productF) return false;
    if (statusF && !(l.pipeline||[]).some(p => p.status === statusF)) return false;
    return true;
  });

  if (leads.length === 0) {
    container.innerHTML = '<div class="empty-state">No leads match your filters.</div>';
    return;
  }

  container.innerHTML = leads.map((l) => {
    const idx = ALL_LEADS.indexOf(l);
    const chips = (l.pipeline||[]).map(p => `<span class="chip ${chipClass(p.status)}">${p.lender}: ${p.status}</span>`).join("");
    return `
      <div class="lead-card ${overallStatusClass(l.pipeline)}" onclick="openSheet(${idx})">
        <div class="lead-top">
          <div>
            <div class="lead-name">${l.name || "—"}</div>
            ${l.companyName ? `<div class="lead-company">${l.companyName}</div>` : ""}
          </div>
          <div class="lead-amount">₹${l.loanAmount || "—"}</div>
        </div>
        <div class="lead-meta">
          <span>${l.product || "—"} · ${l.category || "—"}</span>
          <span>${l.mobile || ""}</span>
          <span class="partner-tag ${l.partnerName === 'Direct' ? 'direct' : ''}">${l.partnerName}</span>
        </div>
        ${chips ? `<div class="chip-row">${chips}</div>` : '<div class="chip-row"><span class="chip process">No lenders in pipeline yet</span></div>'}
      </div>`;
  }).join("");
}

function openSheet(idx) {
  CURRENT_LEAD = ALL_LEADS[idx];
  document.getElementById("sheetName").textContent = CURRENT_LEAD.name || "—";
  document.getElementById("sheetSub").textContent =
    `${CURRENT_LEAD.companyName ? CURRENT_LEAD.companyName + " · " : ""}${CURRENT_LEAD.product} · ₹${CURRENT_LEAD.loanAmount || "—"} · ${CURRENT_LEAD.mobile}`;

  renderPipelineRows();
  renderLenderSelectList();
  renderDsaSelectList();

  document.getElementById("sheetBackdrop").style.display = "block";
  document.getElementById("sheet").style.display = "block";
}

function closeSheet() {
  document.getElementById("sheetBackdrop").style.display = "none";
  document.getElementById("sheet").style.display = "none";
  CURRENT_LEAD = null;
}

function renderPipelineRows() {
  const el = document.getElementById("pipelineRows");
  const pipeline = CURRENT_LEAD.pipeline || [];
  if (pipeline.length === 0) {
    el.innerHTML = '<div class="spinner-inline">No lenders in pipeline yet — add some below.</div>';
    return;
  }
  el.innerHTML = pipeline.map(p => `
    <div class="pipeline-row">
      <div class="lname">${p.lender}${p.assignedDsa ? `<div class="spinner-inline">DSA: ${p.assignedDsa}</div>` : ""}</div>
      <select onchange="updateStatus('${p.lender.replace(/'/g,"\\'")}', this.value)">
        ${["In Process","Approved","Disbursed","Rejected"].map(s => `<option value="${s}" ${s===p.status?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>`).join("");
}

function renderLenderSelectList() {
  const el = document.getElementById("lenderSelectList");
  const already = new Set((CURRENT_LEAD.pipeline||[]).map(p => p.lender));
  const relevant = ACTIVE_LENDERS.filter(l => l.product === CURRENT_LEAD.product && !already.has(l.name));
  if (relevant.length === 0) {
    el.innerHTML = '<div class="spinner-inline" style="padding:10px 0;">No more lenders available for this product.</div>';
    return;
  }
  el.innerHTML = relevant.map(l => `
    <label><input type="checkbox" value="${l.name}" class="lenderCheckbox"> ${l.name} <span class="spinner-inline">(Cat ${l.category})</span></label>
  `).join("");
}

function renderDsaSelectList() {
  const el = document.getElementById("dsaSelectList");
  if (ACTIVE_DSAS.length === 0) {
    el.innerHTML = '<div class="spinner-inline" style="padding:10px 0;">No DSAs added yet — add rows in the DSA Partners sheet tab.</div>';
    return;
  }
  el.innerHTML = ACTIVE_DSAS.map((d,i) => `
    <label>
      <input type="radio" name="dsaPick" value="${i}">
      <span>${d.name}<span class="dsa-email">${d.emails}</span></span>
    </label>`).join("");
}

async function updateStatus(lenderName, status) {
  const result = await apiPost({
    action: "adminUpdateLenderStatus", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, lenderName: lenderName, status: status
  });
  if (result.success) {
    showToast("Status updated");
    CURRENT_LEAD.pipeline.find(p => p.lender === lenderName).status = status;
    renderLeads();
  } else {
    showToast(result.error || "Update failed");
  }
}

async function addSelectedLenders() {
  const checked = Array.from(document.querySelectorAll(".lenderCheckbox:checked")).map(c => c.value);
  if (checked.length === 0) { showToast("Select at least one lender"); return; }
  const result = await apiPost({
    action: "adminAddLendersToPipeline", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, mobile: CURRENT_LEAD.mobile, customerName: CURRENT_LEAD.name,
    companyName: CURRENT_LEAD.companyName, product: CURRENT_LEAD.product, lenderNames: checked
  });
  if (result.success) {
    showToast("Lenders added");
    checked.forEach(name => CURRENT_LEAD.pipeline.push({ lender:name, status:"In Process", assignedDsa:"" }));
    renderPipelineRows();
    renderLenderSelectList();
    renderLeads();
  } else {
    showToast(result.error || "Failed to add lenders");
  }
}

async function assignDsa() {
  const picked = document.querySelector('input[name="dsaPick"]:checked');
  if (!picked) { showToast("Select a DSA"); return; }
  const dsa = ACTIVE_DSAS[picked.value];
  const lenderNames = (CURRENT_LEAD.pipeline || []).map(p => p.lender);
  if (lenderNames.length === 0) { showToast("Add lenders to the pipeline first"); return; }

  const result = await apiPost({
    action: "adminAssignDsa", password: ADMIN_PASSWORD,
    leadId: CURRENT_LEAD.leadId, mobile: CURRENT_LEAD.mobile, customerName: CURRENT_LEAD.name,
    companyName: CURRENT_LEAD.companyName, product: CURRENT_LEAD.product, loanAmount: CURRENT_LEAD.loanAmount,
    dsaName: dsa.name, dsaEmails: dsa.emails, lenderNames: lenderNames, assignedBy: "Admin"
  });
  if (result.success) {
    showToast("Assigned — email sent to " + dsa.name);
    CURRENT_LEAD.pipeline.forEach(p => p.assignedDsa = dsa.name);
    renderPipelineRows();
    renderLeads();
  } else {
    showToast(result.error || "Assignment failed");
  }
}
</script>
</body>
</html>
